<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Birthday</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    #banner {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 14px; text-align: center;
      font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; color: #ffffff;
      background: linear-gradient(90deg, #7b4fd6, #ff7eb6);
      z-index: 999;
    }
    #hint {
      position: fixed; bottom: 15px; left: 0; right: 0;
      text-align: center; color: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; z-index: 999;
      background: rgba(61,30,109,0.75);
      border-top: 2px solid #ffd166;
      padding: 8px;
    }
  </style>

  <script>
    // 0. FIX - AR.js changes the camera projection but not its inverse,
    // so tap/click rays miss the objects. This keeps the inverse in sync.
    AFRAME.registerComponent('ar-raycast-fix', {
      tick: function () {
        var cam = this.el.getObject3D('camera');
        if (cam) {
          cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
        }
      }
    });

    // 1. WORKSHOP - Ball colour change
    AFRAME.registerComponent('change-color-on-click', {
      init: function () {
        var colors = ['#ff0000', '#0000ff'];
        var i = 0;
        this.el.addEventListener('click', () => {
          i = (i + 1) % colors.length;
          this.el.setAttribute('material', 'color', colors[i]);
        });
      }
    });

    // 2. YOUR OWN COMPONENT - Gift grows + Surprise text
    AFRAME.registerComponent('grow-on-tap', {
      init: function () {
        var isBig = false;
        var label = document.querySelector('#surprise-label');
        this.el.addEventListener('click', () => {
          if (!isBig) {
            // Big
            this.el.setAttribute('animation__scale', 'property: scale; to: 2 2 2; dur: 500');
            this.el.setAttribute('animation__lift', 'property: position; to: -0.7 0.55 0.4; dur: 500');
            label.setAttribute('visible', true);
          } else {
            // Back to small
            this.el.setAttribute('animation__scale', 'property: scale; to: 1 1 1; dur: 500');
            this.el.setAttribute('animation__lift', 'property: position; to: -0.7 0.3 0.4; dur: 500');
            label.setAttribute('visible', false);
          }
          isBig = !isBig;
        });
      }
    });

    // 3. YOUR OWN COMPONENT - Party Hat toggles confetti balls
    AFRAME.registerComponent('toggle-confetti', {
      init: function () {
        var confetti = document.querySelector('#confetti-group');
        this.el.addEventListener('click', () => {
          confetti.setAttribute('visible', !confetti.getAttribute('visible'));
        });
      }
    });
  </script>
</head>

<body style="margin:0; overflow:hidden;">
  <!-- BANNER -->
  <div id="banner">🎉 Happy Birthday! 🎂</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;"
    cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable; far: 100">

    <a-marker preset="hiro" id="marker">

      <!-- Title Labels -->
      <a-text value="Happy Birthday!" position="0 2.3 0" align="center" color="#ff7eb6" scale="1.3 1.3 1.3"></a-text>
      <a-text id="surprise-label" value="Surprise! Make a Wish!" position="0 1.9 0" align="center" color="#6e20e3" visible="false"></a-text>

      <!-- Ground - Deep Purple Table with trim -->
      <a-box position="0 0 0" width="2.4" height="0.1" depth="2.4" color="#3d1e6d"></a-box>
      <a-box position="0 0.06 0" width="2.5" height="0.03" depth="2.5" color="#6e20e3"></a-box>

      <!-- 1. GIFT BOX - TAPPABLE GROW (box + ribbons scale together) -->
      <a-box class="clickable" grow-on-tap position="-0.7 0.3 0.4" width="0.5" height="0.5" depth="0.5" color="#6ec6ff">
        <a-box width="0.55" height="0.1" depth="0.55" color="#ff7eb6"></a-box>
        <a-box width="0.1" height="0.55" depth="0.55" color="#ff7eb6"></a-box>
      </a-box>

      <!-- 2. BIRTHDAY CAKE -->
      <a-cylinder position="0.5 0.3 0.3" radius="0.35" height="0.5" color="#fff4e6"></a-cylinder>
      <a-cylinder position="0.5 0.55 0.3" radius="0.25" height="0.25" color="#ffb88c"></a-cylinder>

      <!-- Candle + flame -->
      <a-cylinder position="0.5 0.8 0.3" radius="0.03" height="0.25" color="#7ee8c7"></a-cylinder>
      <a-sphere position="0.5 0.98 0.3" radius="0.05" color="#6e20e3"
        animation="property: scale; to: 1.4 1.4 1.4; dir: alternate; dur: 500; loop: true"></a-sphere>

      <!-- 3. PARTY HAT - TAPPABLE TOGGLE CONFETTI -->
      <a-cone class="clickable" toggle-confetti position="-0.1 0.33 -0.5" radius-bottom="0.2" radius-top="0" height="0.5" color="#b8a1ff"></a-cone>
      <a-sphere position="-0.1 0.6 -0.5" radius="0.06" color="#ffd166"></a-sphere>

      <!-- 4. WORKSHOP BALL - TAPPABLE COLOUR CHANGE -->
      <a-sphere class="clickable" change-color-on-click position="0.1 0.25 -0.3" radius="0.15" color="#ff0000"></a-sphere>

      <!-- Confetti Group - Hidden at start -->
      <a-entity id="confetti-group" visible="false">
        <a-sphere position="-0.5 1.4 0"    radius="0.05" color="#ff7eb6"></a-sphere>
        <a-sphere position="0.2 1.6 -0.3"  radius="0.05" color="#7ee8c7"></a-sphere>
        <a-sphere position="0.8 1.3 0.2"   radius="0.05" color="#6ec6ff"></a-sphere>
        <a-sphere position="-0.3 1.1 0.5"  radius="0.05" color="#ffd166"></a-sphere>
        <a-sphere position="0.6 1.7 -0.4"  radius="0.05" color="#b8a1ff"></a-sphere>
        <a-sphere position="-0.8 1.2 -0.3" radius="0.05" color="#ffb88c"></a-sphere>
      </a-entity>

    </a-marker>

    <a-entity camera ar-raycast-fix></a-entity>
  </a-scene>

  <div id="hint">Point at the Hiro marker, then tap the gift, hat or ball!</div>
</body>
</html>
